<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICT Club Checker</title>

  <!-- Bootstrap for the design -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- PyScript so we can run Python in the browser -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* dark background for the whole page */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b);
      color: white;
      min-height: 100vh;
    }

    /* the box that holds the form */
    .card-box {
      background: #2b2d6e;
      border: 3px solid #ffd93d;
      border-radius: 12px;
      padding: 30px;
      max-width: 420px;
      margin: 60px auto 20px;
    }

    h1 { color: #ffd93d; font-weight: 700; }

    /* red button */
    .btn-enter {
      background: #ff4d6d;
      color: white;
      width: 100%;
    }
    .btn-enter:hover { background: #ff758f; color: white; }

    /* the area where the message shows up */
    #result {
      margin-top: 20px;
      text-align: center;
      color: #ffe66d;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card-box text-center">
    <h1>ICT CLUB CHECKER</h1>
    <p>Candidate Verification System</p>

    <!-- two input fields -->
    <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
    <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">

    <!-- button, it runs the Python function check_name when clicked -->
    <button class="btn btn-enter" py-click="check_name">ENTER</button>

    <!-- result area -->
    <div id="result"></div>
  </div>

  <p class="text-center text-white">© 2026 ICT Club · Seatwork 1 · 2nd Quarter</p>

  <script type="py">
    from pyscript import document

    # list of club members (based on famous singers)
    club_members = [
        "Taylor Swift",
        "Bruno Mars",
        "Ariana Grande",
        "Ed Sheeran",
        "Billie Eilish",
        "Drake",
        "Rihanna"
    ]

    # the two possible messages, True is for on the list and False is for not on the list
    messages = {
        True: "Congratulations {name}! You are now part of the ICT club.",
        False: "Sorry {name}, your name is not on the list."
    }

    def check_name(event):
        # get what the user typed in the two boxes
        first = document.getElementById("first_name").value
        last = document.getElementById("last_name").value

        # combine first and last name into one full name
        # strip removes extra spaces and title makes it like "Taylor Swift"
        full_name = (first.strip() + " " + last.strip()).title()

        # check if the full name is in the list and save the answer (True or False)
        is_member = full_name in club_members

        # pick the right message using the answer, then put the name in it
        message = messages[is_member].format(name=full_name)

        # show the message in the result area
        document.getElementById("result").innerText = message
  </script>
</body>
</html>
